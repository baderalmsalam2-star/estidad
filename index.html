<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<title>منصة الاستعداد لاختبارات الوظائف الدينية</title>
<meta name="description" content="تدريبٌ على المنهج المقرَّر لوظائف الإمامة والأذان — وزارة الأوقاف والشؤون الإسلامية، دولة الكويت.">
<!--
  سياسةُ محتوًى معلَنة.

  والتطبيقُ لا يجلب من خارجِ أصلِه شيئاً البتّة: لا خطَّ ولا مكتبةَ ولا صورة —
  وذلك قيدٌ معماريٌّ مكتوبٌ في README لا صدفة. فالسياسةُ تُثبِّت الواقعَ الحاصلَ
  لا تُضيِّق عليه، وأيُّ إضافةٍ تخرقها تُخفِق عند أوّلِ تجربةٍ لا بعد النشر.

  وإنّما تُكتَب لأنّ في قلبِ باني الواجهةِ `innerHTML` (الوسمُ `html:` في
  `ui.js`، وهو الذي تُبنى به كلُّ أيقونةِ SVG في التطبيق). ولا يُمرَّر إليه
  اليومَ إلا نصٌّ مكتوبٌ في الكود — فحصتُه موضعاً موضعاً — لكنّه مصرفٌ قائم،
  وسطرٌ يُغفَل يوماً يجعله طريقاً. فـ`script-src 'self'` يَقطع تشغيلَ ما
  يُحقَن، و`object-src 'none'` و`base-uri 'none'` و`form-action 'none'` تَسُدُّ
  ما يُلتفُّ به عليه. ولا تُكتَب `frame-ancestors` ههنا: الوسمُ يُهمِلها المتصفّحُ
  عمداً (تُقبَل في ترويسةِ HTTP وحدَها)، وGitHub Pages لا يضبط ترويسات — فكتابتُها
  دعوى حمايةٍ لا تقع.

  و`style-src` فيها `'unsafe-inline'` اضطراراً: الواجهةُ تُبنى بـ`el()` وهي
  تكتب `style` على العناصرِ كتابةً مباشرة، في مئاتِ المواضع.

  و`connect-src 'self'` تكفي ما دام `sync.js ← SERVER` فارغاً. ويومَ يُنشَر
  خادمُ الإحصاء **يُزاد أصلُه ههنا** وإلا رُدَّ كلُّ إرسالٍ صامتاً — وهو مكتوبٌ
  في `server/اقرأني.md` مع خطواتِ النشر.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2314655a'/%3E%3Ctext x='50' y='72' font-size='62' font-family='serif' font-weight='700' fill='%23faf7f1' text-anchor='middle'%3E%D9%88%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<!-- أيقونةُ iOS مصمَتةٌ لا شفّافةَ الأركان: النظامُ يُركِّبها على **أسودَ**
     ثمّ يُدوِّر أركانَها بنفسه، فأركانُ `icon-192` الشفّافةُ كانت تسودُّ على
     شاشةِ آيفون. و١٨٠ بكسلاً هو المقاسُ الذي يطلبه iOS. -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الاستعداد">
<link rel="preload" href="assets/fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <main id="screen" class="screen" tabindex="-1"></main>
      <!-- اسمٌ يميّزه: كان يُنطَق «تنقّل» مجرّداً، ولا يُعرَف أيُّ تنقّل. -->
      <nav id="tabbar" class="tabbar" aria-label="أقسام التطبيق" hidden></nav>
    </div>
  </div>
  <script type="module" src="assets/js/app.js"></script>

  <!--
    متصفّحٌ أقدمُ من أرضيّةِ التطبيق — يُقال له بالعربية، ولا يُترَك بصفحةٍ بيضاء.
    وشرحُه كلُّه في رأسِ `assets/js/compat.js`. وهو ملفٌّ لا سطورٌ ههنا لأنّ
    سياسةَ المحتوى تمنع الغرز — ولو بقي في الصفحةِ لرفضَه المتصفّحُ صامتاً،
    فصارت الرسالةُ التي تمنع البياضَ هي أوّلَ ما يذهب.

    و`defer` لا `async`: يُنفَّذ بعد بناءِ المستند فيجد `#screen`، ولا يزاحم
    أوّلَ رسم.
  -->
  <script src="assets/js/compat.js" defer></script>

  <noscript>
    <p style="padding:24px;font-family:system-ui">هذا التطبيق يحتاج جافاسكربت للعمل.</p>
  </noscript>
</body>
</html>
